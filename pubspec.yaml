name: streetpartner
description: "Sheild - Women Safety App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  shared_preferences: ^2.2.2
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  google_sign_in: ^6.2.1
  cloud_firestore: ^6.8.0
  image_picker: ^1.2.3
  firebase_storage: ^13.4.6
  audioplayers: ^6.1.0
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  http: ^1.6.0
  geolocator: ^14.0.3
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  timeago: ^3.7.1
  google_generative_ai: ^0.4.7
  url_launcher: ^6.3.2
  flutter_localizations:
    sdk: flutter
  intl: any
  audio_session: ^0.2.4
  telephony: ^0.2.0
  flutter_markdown: ^0.7.7+1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/icon/
    - assets/images/

